<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FoxNas Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
        :root { --primary: #00f2ff; --accent: #ff0055; --bg-dark: #05080a; --panel-bg: rgba(10, 15, 20, 0.9); --border: 1px solid rgba(0, 242, 255, 0.3); --glow: 0 0 15px rgba(0, 242, 255, 0.3); }
        body { margin: 0; font-family: 'JetBrains Mono', monospace; background: var(--bg-dark); color: #e0faff; overflow: hidden; height: 100vh; user-select: none}
        .video-wrapper { 
            display: flex; flex-direction: column; height: 100vh; width: 100vw; 
            justify-content: center; align-items: center; position: relative;
        }
        video { max-width: 100%; max-height: 100%; box-shadow: 0 0 50px rgba(0,255,157,0.1); }
        
        /* Custom UI Overlay */
        .video-ui {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px; transition: opacity 0.3s;
            font-family: 'JetBrains Mono'; color: var(--primary);
            display: flex; flex-direction: column; gap: 10px;
        }
        .video-wrapper.hide-cursor { cursor: none; }
        .video-wrapper.hide-cursor .video-ui { opacity: 0; }

        .progress-container { width: 100%; height: 5px; background: #222; cursor: pointer; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; box-shadow: 0 0 10px var(--primary); }
        .video-info { display: flex; justify-content: space-between; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="video-wrapper" id="playerWrapper">
    <video id="mainVideo" autoplay></video>
    
    <div class="video-ui">
        <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
        <div class="video-info">
            <span id="videoTitle">LOADING_STREAM...</span>
            <span id="videoTime">00:00 / 00:00</span>
        </div>
    </div>
</div>

<script>
    // Pfad aus URL holen
    const params = new URLSearchParams(window.location.search);
    const videoPath = params.get('path');
    const video = document.getElementById('mainVideo');
    const wrapper = document.getElementById('playerWrapper');

    if(videoPath) {
        video.src = `/api/stream?path=${encodeURIComponent(videoPath)}`;
        document.getElementById('videoTitle').innerText = videoPath.split('\\').pop();
    }

    // Maus verstecken Logik
    let idleTimer;
    window.addEventListener('mousemove', () => {
        wrapper.classList.remove('hide-cursor');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => wrapper.classList.add('hide-cursor'), 2000);
    });

    // Progress Bar Update
    video.addEventListener('timeupdate', () => {
        const pc = (video.currentTime / video.duration) * 100;
        document.getElementById('progBar').style.width = pc + "%";
        document.getElementById('videoTime').innerText = 
            formatTime(video.currentTime) + " / " + formatTime(video.duration);
    });

    function formatTime(seconds) {
        if (!seconds) return "00:00";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return (h > 0 ? h + ":" : "") + m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
    }
</script>

<script src="frontend/keybinds.videostream.js"></script>
</body>
</html>
