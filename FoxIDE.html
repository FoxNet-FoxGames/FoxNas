<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FoxIDE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.FoxIDE.css">
</head>
<body>

<header>
    <div class="file-info">FoxIDE // <span id="fileNameDisplay">---</span> <span id="statusMsg" class="status-msg"></span></div>
    <div style="display:flex; gap:10px;">
        <button class="btn-action" onclick="togglePreview()">TOGGLE PREVIEW</button>
        <button class="btn-action" onclick="saveFile()">SPEICHERN (STRG+S)</button>
    </div>
</header>

<div class="ide-container">
    <div class="editor-pane">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="code-container" id="scrollContainer">
            <pre id="highlighting" aria-hidden="true"></pre>
            <textarea id="editor" spellcheck="false" wrap="off"></textarea>
        </div>
    </div>
    <div class="preview-pane" id="previewPane">
        <iframe id="previewFrame"></iframe>
    </div>
</div>

<script src="frontend/FoxIDE.js"></script>

</body>
</html>
