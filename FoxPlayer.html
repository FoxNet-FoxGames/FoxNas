<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FoxNas Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.FoxPlayer.css">
</head><body>

<div class="video-wrapper" id="playerWrapper">

<video id="mainVideo" autoplay></video>

<div id="settingsPanel">
    <h4>FoxPlayer</h4>
    <div class="setting-item">
        <span>Stretch</span>
        <input type="checkbox" id="stretchCheck" onchange="toggleStretch()">
    </div>
    <hr style="border:0; border-top:1px solid #222">
    <h4>Keybinds</h4>
    <div class="setting-item"><span>PLAY/PAUSE</span><div class="key-input" id="kb_play1" onclick="captureKey('kb_play1')">Leertaste</div></div>
    <div class="setting-item"><span>PLAY/PAUSE</span><div class="key-input" id="kb_play2" onclick="captureKey('kb_play2')">K</div></div>
    <div class="setting-item"><span>FULLSCREEN</span><div class="key-input" id="kb_full" onclick="captureKey('kb_full')">F</div></div>
    <div class="setting-item"><span>3s ></span><div class="key-input" id="kb_3" onclick="captureKey('kb_3')">PfeilRechts</div></div>
    <div class="setting-item"><span>3s <</span><div class="key-input" id="kb_3" onclick="captureKey('kb_3')">PfeilLinks</div></div>
    <div class="setting-item"><span>10s ></span><div class="key-input" id="kb_10" onclick="captureKey('kb_10')">L</div></div>
    <div class="setting-item"><span>10s <</span><div class="key-input" id="kb_10" onclick="captureKey('kb_10')">J</div></div>
    <div class="setting-item"><span>Stummschaltung</span><div class="key-input" id="kb_mute" onclick="captureKey('kb_mute')">M</div></div>

    <div style="display:flex; gap:5px; margin-top:10px;">
        <button onclick="saveSettings()" style="flex:1; background:var(--primary); border:none; padding:8px; cursor:pointer; font-family:'Orbitron'; font-size:0.6rem">Speichern</button>
        <button onclick="resetDefaults()" style="background:#333; color:#fff; border:none; padding:8px; cursor:pointer; font-family:'Orbitron'; font-size:0.5rem">Werkseinstellungen</button>
    </div>
</div>

    <div class="video-ui">
        <div class="progress-container" id="progCont">
            <div class="progress-bar" id="progBar"></div>
        </div>
        <div class="controls-row">
            <div class="video-info">
                <span id="videoTitle">LOADING...</span>
                <span id="videoTime">00:00 / 00:00</span>
            </div>
            <button class="btn-settings" onclick="toggleSettingsPanel()">⚙</button>
        </div>
    </div>
</div>

<script src="frontend/video.js"></script>
<script src="frontend/keybinds.FoxPlayer.js"></script>

</body></html>
