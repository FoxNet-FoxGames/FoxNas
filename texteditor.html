<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FoxNas IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00f2ff; 
            --accent: #ff0055; 
            --bg-dark: #05080a; 
            --panel-bg: rgba(10, 15, 20, 0.98);
            --border: 1px solid rgba(0, 242, 255, 0.3);
            --keyword: #ff0055;
            --string: #00f2ff;
            --tag: #00f2ff;
            --attr: #adadad;
            --comment: #4a5a6a;
            --func: #00f2ff;
        }

        body { 
            margin: 0; font-family: 'JetBrains Mono', monospace; 
            background: var(--bg-dark); color: #e0faff; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            background: #0a1116; padding: 0 20px; height: 40px;
            border-bottom: 1px solid var(--primary); display: flex; 
            justify-content: space-between; align-items: center;
            font-family: 'Orbitron'; font-size: 0.75rem; flex-shrink: 0; z-index: 10;
        }

        .ide-container { display: flex; flex: 1; height: calc(100vh - 40px); position: relative; }

        .editor-pane { flex: 1; display: flex; background: var(--bg-dark); overflow: hidden; }

        .line-numbers {
            width: 50px; background: #0a0e12; color: #4a5a6a;
            text-align: right; padding: 20px 10px; font-size: 14px;
            line-height: 1.5; border-right: 1px solid #1a2228; user-select: none; overflow: hidden;
        }

        .code-container { flex: 1; position: relative; overflow: auto; background: var(--bg-dark); }

        #editor, #highlighting {
            margin: 0; padding: 20px; border: none;
            font-family: 'JetBrains Mono', monospace; font-size: 14px;
            line-height: 1.5; tab-size: 4; box-sizing: border-box;
            position: absolute; top: 0; left: 0; white-space: pre;
            min-width: 100%; min-height: 100%;
        }

        #highlighting { z-index: 1; color: #e0faff; pointer-events: none; }

        #editor {
            z-index: 2; background: transparent; color: transparent;
            caret-color: var(--primary); outline: none; resize: none; overflow: hidden;
        }

        /* --- DIE FARBBOX --- */
.color-preview {
    display: inline-block;
    padding: 0 4px;
    margin: 0 2px;
    border-radius: 3px;
    /* Ein dunkler, fast schwarzer Hintergrund in der Box */
    background: rgba(0, 0, 0, 0.8) !important; 
    /* Ein feiner, heller Rahmen sorgt für Sichtbarkeit auf Schwarz */
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-weight: bold;
    font-size: 0.9em;
    line-height: 1.2;
    vertical-align: middle;
}

        .preview-pane {
            flex: 1; background: #fff; display: none;
            flex-direction: column; border-left: 2px solid var(--primary);
        }

        iframe { flex: 1; border: none; }

        .btn-action { 
            background: transparent; border: 1px solid var(--primary); 
            color: var(--primary); padding: 4px 12px; cursor: pointer; 
            font-family: 'Orbitron'; font-size: 0.65rem; transition: 0.2s;
        }
        .btn-action:hover { background: var(--primary); color: #000; }

        .hl-tag { color: var(--tag); }
        .hl-attr { color: var(--attr); font-style: italic; }
        .hl-string { color: var(--keyword); }
        .hl-comment { color: var(--comment); }
        .hl-keyword { color: var(--accent); font-weight: bold; }
        .hl-func { color: var(--func); }

        .code-container::-webkit-scrollbar { width: 10px; height: 10px; }
        .code-container::-webkit-scrollbar-track { background: #05080a; }
        .code-container::-webkit-scrollbar-thumb { background: #1a2a30; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<header>
    <div class="file-info">FOXNAS_IDE // <span id="fileNameDisplay">---</span> <span id="statusMsg" class="status-msg"></span></div>
    <div style="display:flex; gap:10px;">
        <button class="btn-action" onclick="togglePreview()">TOGGLE_PREVIEW</button>
        <button class="btn-action" onclick="saveFile()">SAVE (STRG+S)</button>
    </div>
</header>

<div class="ide-container">
    <div class="editor-pane">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="code-container" id="scrollContainer">
            <pre id="highlighting" aria-hidden="true"></pre>
            <textarea id="editor" spellcheck="false" wrap="off"></textarea>
        </div>
    </div>
    <div class="preview-pane" id="previewPane">
        <iframe id="previewFrame"></iframe>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const highlighting = document.getElementById('highlighting');
    const scrollContainer = document.getElementById('scrollContainer');
    const lineNumbers = document.getElementById('lineNumbers');
    const params = new URLSearchParams(window.location.search);
    const filePath = params.get('path');
    let currentExt = 'txt';

    function syncSize() {
        const lines = editor.value.split('\n');
        const longestLine = lines.reduce((max, line) => Math.max(max, line.length), 0);
        editor.style.width = (longestLine * 8.5 + 150) + 'px';
        editor.style.height = (lines.length * 21 + 150) + 'px';
        highlighting.style.width = editor.style.width;
        highlighting.style.height = editor.style.height;
    }

    function updateView() {
        const text = editor.value;
        syncSize();
        
        let code = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // Syntax Highlighting
        if (['js', 'json'].includes(currentExt)) {
            code = code.replace(/(['"`])(.*?)\1/g, '<span class="hl-string">$&</span>')
                       .replace(/\b(const|let|var|function|return|if|else|for|while|await|async|class|true|false|null)\b/g, '<span class="hl-keyword">$&</span>')
                       .replace(/(\w+)(?=\()/g, '<span class="hl-func">$1</span>')
                       .replace(/(\/\/.*)/g, '<span class="hl-comment">$1</span>');
        } else if (currentExt === 'html') {
            code = code.replace(/(&lt;\/?[a-z0-9]+)(.*?)(\&gt;)/gi, (m, t, a, e) => {
                const ca = a.replace(/([a-z-]+)=/gi, '<span class="hl-attr">$1</span>=');
                return `<span class="hl-tag">${t}</span>${ca}<span class="hl-tag">${e}</span>`;
            });
        }

        // --- HEX CODE LOGIK ---
        // Färbt den Text in der Box und gibt ihm einen Glow in seiner eigenen Farbe
        code = code.replace(/(#[0-9a-fA-F]{3,8})\b/g, (match) => {
            return `<span class="color-preview" style="color: ${match}; text-shadow: 0 0 4px ${match};">${match}</span>`;
        });

        highlighting.innerHTML = code + (text.endsWith('\n') ? ' ' : '');
        lineNumbers.innerHTML = text.split('\n').map((_, i) => i + 1).join('<br>');
    }

    editor.addEventListener('input', updateView);
    scrollContainer.addEventListener('scroll', () => {
        lineNumbers.scrollTop = scrollContainer.scrollTop;
    });

    if (filePath) {
        document.getElementById('fileNameDisplay').innerText = filePath.split('\\').pop().toUpperCase();
        currentExt = filePath.split('.').pop().toLowerCase();
        fetch(`/api/stream?path=${encodeURIComponent(filePath)}`)
            .then(r => r.text()).then(d => { editor.value = d; updateView(); });
    }

    async function saveFile() {
        const res = await fetch('/api/save-text', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ filePath, content: editor.value })
        });
        if(res.ok) { 
            document.getElementById('statusMsg').innerText = "SAVED";
            setTimeout(() => document.getElementById('statusMsg').innerText = "", 2000);
        }
    }

    window.addEventListener('keydown', e => {
        if(e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
        if(e.key === 'Tab') {
            e.preventDefault();
            const s = editor.selectionStart;
            editor.value = editor.value.substring(0, s) + "\t" + editor.value.substring(editor.selectionEnd);
            editor.selectionStart = editor.selectionEnd = s + 1;
            updateView();
        }
    });

    function togglePreview() {
        const p = document.getElementById('previewPane');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        if(p.style.display === 'flex') {
            const doc = document.getElementById('previewFrame').contentDocument;
            doc.open(); doc.write(editor.value); doc.close();
        }
    }
</script>
</body>
</html>
